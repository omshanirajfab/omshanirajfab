<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Salary Slip - Print Preview</title>
  <style>
    :root {
      --primary: #1e3a8a;
      --primary-dark: #0f172a;
      --border: #334155;
      --border-light: #cbd5e1;
      --font: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --mono: "Roboto Mono", monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font);
      background-color: #525659;
      color: #0f172a;
      -webkit-font-smoothing: antialiased;
    }

    .print-toolbar {
      position: sticky;
      top: 0;
      z-index: 9999;
      background: #0f172a;
      color: white;
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 14px rgba(0,0,0,0.35);
    }
    .print-toolbar-title {
      font-size: 16px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .print-btn-group {
      display: flex;
      gap: 12px;
    }
    .btn-action-print {
      background: #10b981;
      color: white;
      border: none;
      padding: 10px 24px;
      border-radius: 6px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 2px 6px rgba(16, 185, 129, 0.4);
      transition: transform 0.1s, background 0.2s;
    }
    .btn-action-print:hover {
      background: #059669;
      transform: translateY(-1px);
    }
    .btn-action-close {
      background: #475569;
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-action-close:hover {
      background: #334155;
    }

    .payslip-sheet-container {
      display: flex;
      justify-content: center;
      padding: 24px 10px 40px;
    }

    .payslip-sheet {
      width: 210mm;
      min-height: 280mm;
      background: #ffffff;
      padding: 14mm 14mm 12mm 14mm;
      box-shadow: 0 8px 30px rgba(0,0,0,0.25);
      position: relative;
      font-size: 13px;
      line-height: 1.4;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* Company Header */
    .company-header-table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 10px;
      border-bottom: 2.5px solid #0f172a;
      padding-bottom: 8px;
    }

    .comp-logo {
      width: 90px;
      max-height: 65px;
      object-fit: contain;
    }

    .comp-title {
      font-size: 21px;
      font-weight: 900;
      color: #0f172a;
      letter-spacing: -0.02em;
      text-transform: uppercase;
    }

    .comp-tagline {
      font-size: 11px;
      font-weight: 700;
      color: #1e3a8a;
      margin-top: 1px;
    }

    .comp-desc {
      font-size: 10.5px;
      color: #334155;
      margin-top: 2px;
      line-height: 1.35;
    }

    .slip-banner {
      background: #0f172a;
      color: #ffffff;
      text-align: center;
      padding: 6px 12px;
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      margin-bottom: 12px;
      border-radius: 4px;
    }

    /* Meta Details Table */
    .info-table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 14px;
      border: 1.5px solid #0f172a;
      font-size: 12px;
    }

    .info-table td {
      padding: 5px 8px;
      border: 1px solid #cbd5e1;
      vertical-align: middle;
    }

    .info-table td.label {
      font-weight: 700;
      color: #334155;
      background: #f8fafc;
      width: 18%;
    }

    .info-table td.val {
      font-weight: 600;
      color: #0f172a;
      width: 32%;
    }

    /* Financial Table */
    .salary-table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 12px;
      border: 1.5px solid #0f172a;
      font-size: 12.5px;
    }

    .salary-table th {
      background: #e2e8f0;
      color: #0f172a;
      font-weight: 800;
      padding: 7px 10px;
      border: 1px solid #0f172a;
      text-transform: uppercase;
      font-size: 12px;
    }

    .salary-table td {
      padding: 6px 10px;
      border: 1px solid #cbd5e1;
      vertical-align: middle;
    }

    .amount-col {
      text-align: right;
      font-family: var(--mono);
      font-weight: 600;
      width: 18%;
    }

    .total-row td {
      background: #f1f5f9;
      font-weight: 800;
      border-top: 2px solid #0f172a;
      border-bottom: 2px solid #0f172a;
      padding: 7px 10px;
    }

    /* Net Pay Box */
    .net-pay-box {
      border: 2px solid #1e3a8a;
      background: #f8fafc;
      padding: 10px 14px;
      border-radius: 6px;
      margin-bottom: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .net-pay-left {
      font-size: 12px;
      color: #334155;
    }

    .net-pay-words {
      font-weight: 800;
      color: #0f172a;
      font-size: 13px;
      margin-top: 3px;
      text-transform: capitalize;
    }

    .net-pay-right {
      text-align: right;
    }

    .net-pay-title {
      font-size: 11px;
      font-weight: 700;
      color: #1e3a8a;
      text-transform: uppercase;
    }

    .net-pay-amount {
      font-size: 20px;
      font-weight: 900;
      color: #1e3a8a;
      font-family: var(--mono);
      letter-spacing: -0.02em;
    }

    /* Signatures */
    .sign-section {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-top: 24px;
      padding-top: 10px;
    }

    .sign-box {
      width: 44%;
      text-align: center;
    }

    .sign-line {
      border-top: 1.5px dashed #475569;
      margin-bottom: 6px;
      padding-top: 4px;
    }

    .sign-title {
      font-size: 12px;
      font-weight: 700;
      color: #0f172a;
    }

    .sign-subtitle {
      font-size: 10.5px;
      color: #64748b;
    }

    .footer-note {
      text-align: center;
      font-size: 10px;
      color: #64748b;
      margin-top: 16px;
      border-top: 1px solid #e2e8f0;
      padding-top: 6px;
    }

    @media print {
      @page {
        size: A4 portrait;
        margin: 10mm 10mm 10mm 10mm;
      }
      body {
        background: #ffffff !important;
        color: #000000 !important;
      }
      .print-toolbar, .no-print {
        display: none !important;
      }
      .payslip-sheet-container {
        padding: 0 !important;
      }
      .payslip-sheet {
        box-shadow: none !important;
        width: 100% !important;
        min-height: auto !important;
        padding: 0 !important;
      }
      .slip-banner {
        background: #0f172a !important;
        color: #ffffff !important;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }
      .salary-table th, .total-row td, .info-table td.label {
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }
    }
  </style>
</head>
<body>

  <div class="print-toolbar no-print">
    <div class="print-toolbar-title">
      <span>💼</span>
      <span id="toolbarTitle">OSF Salary Slip Print Preview</span>
    </div>
    <div class="print-btn-group">
      <button type="button" class="btn-action-print" onclick="window.print()">
        🖨️ Save as PDF / Print Salary Slip
      </button>
      <button type="button" class="btn-action-close" onclick="window.close()">
        ✕ Close Window
      </button>
    </div>
  </div>

  <div class="payslip-sheet-container">
    <div class="payslip-sheet" id="payslipRoot">
      <!-- Payslip Injected by JavaScript -->
    </div>
  </div>

  <script src="js/data.js"></script>
  <script>
    function formatINR(val) {
      var num = parseFloat(val) || 0;
      return num.toLocaleString("en-IN", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function renderPayslip() {
      var params = new URLSearchParams(window.location.search);
      var slipId = params.get("id");
      var slipData = null;

      if (slipId) {
        try {
          var list = JSON.parse(localStorage.getItem("osf_salary_slips_db") || "[]");
          slipData = list.find(function(s) { return s.id === slipId; });
        } catch(e) {}
      }

      if (!slipData) {
        try {
          var draft = localStorage.getItem("osf_active_payslip");
          if (draft) slipData = JSON.parse(draft);
        } catch(e) {}
      }

      if (!slipData) {
        document.getElementById("payslipRoot").innerHTML = "<div style='text-align:center;padding:40px;color:#ef4444;font-size:16px;font-weight:700;'>No salary slip data found to preview. Please create and save a salary slip first.</div>";
        return;
      }

      var comp = {};
      try {
        comp = JSON.parse(localStorage.getItem("osf_company_config") || "{}");
      } catch(e) {}

      var compName = comp.name || "OM SHANIRAJESHWAR FABRICATION";
      var compTag = comp.tagline || "ENGINEERING, HEAVY INDUSTRIAL FABRICATION & PIPELINE ERECTION";
      var compAddr = comp.address || "Works: Plot No. 24, Industrial Area, MIDC, Mumbai, Maharashtra";
      var compGstin = comp.gstin || "27ABCDE1234F1Z5";
      var compPhone = comp.phone || "+91 98765 43210";
      var compEmail = comp.email || "info@omshanifab.in";

      document.title = "Payslip - " + (slipData.empName || "Employee") + " (" + (slipData.payMonth || "") + ")";
      document.getElementById("toolbarTitle").innerText = "Payslip - " + (slipData.empName || "") + " [" + (slipData.payMonth || "") + "]";

      var grossEarnings = (parseFloat(slipData.basic) || 0) + (parseFloat(slipData.hra) || 0) + (parseFloat(slipData.conveyance) || 0) + (parseFloat(slipData.otAmount) || 0) + (parseFloat(slipData.specialAllowance) || 0);
      var totalDeductions = (parseFloat(slipData.pf) || 0) + (parseFloat(slipData.esic) || 0) + (parseFloat(slipData.pt) || 0) + (parseFloat(slipData.advance) || 0) + (parseFloat(slipData.tds) || 0) + (parseFloat(slipData.otherDeductions) || 0);
      var netPay = grossEarnings - totalDeductions;
      if (netPay < 0) netPay = 0;

      var html = `
        <div>
          <!-- Company Header -->
          <table class="company-header-table">
            <tr>
              <td style="width: 100px; vertical-align: middle;">
                <img src="assets/logo.png" alt="OSF Logo" class="comp-logo" onerror="this.style.display='none'" />
              </td>
              <td style="vertical-align: middle; padding-left: 10px;">
                <div class="comp-title">${compName}</div>
                <div class="comp-tagline">${compTag}</div>
                <div class="comp-desc">${compAddr}</div>
                <div class="comp-desc"><strong>GSTIN:</strong> ${compGstin} | <strong>Contact:</strong> ${compPhone} | <strong>Email:</strong> ${compEmail}</div>
              </td>
            </tr>
          </table>

          <!-- Payslip Banner -->
          <div class="slip-banner">
            PAYSLIP FOR THE MONTH OF ${slipData.payMonth || "CURRENT MONTH"}
          </div>

          <!-- Employee & Attendance Info -->
          <table class="info-table">
            <tr>
              <td class="label">Employee ID:</td>
              <td class="val"><strong>${slipData.empCode || "OSF-EMP-001"}</strong></td>
              <td class="label">Pay Date:</td>
              <td class="val">${slipData.payDate || new Date().toLocaleDateString("en-IN")}</td>
            </tr>
            <tr>
              <td class="label">Employee Name:</td>
              <td class="val"><strong>${slipData.empName || "Staff Member"}</strong></td>
              <td class="label">Department:</td>
              <td class="val">${slipData.department || "Fabrication Works"}</td>
            </tr>
            <tr>
              <td class="label">Designation:</td>
              <td class="val">${slipData.designation || "Fabricator / Welder"}</td>
              <td class="label">Date of Joining:</td>
              <td class="val">${slipData.doj || "N/A"}</td>
            </tr>
            <tr>
              <td class="label">Bank Name:</td>
              <td class="val">${slipData.bankName || "State Bank of India"}</td>
              <td class="label">Bank Account No:</td>
              <td class="val" style="font-family:var(--mono);">${slipData.bankAccount || "N/A"}</td>
            </tr>
            <tr>
              <td class="label">IFSC Code:</td>
              <td class="val" style="font-family:var(--mono);">${slipData.ifsc || "N/A"}</td>
              <td class="label">PAN Number:</td>
              <td class="val" style="font-family:var(--mono);">${slipData.pan || "N/A"}</td>
            </tr>
            <tr>
              <td class="label">UAN / PF No:</td>
              <td class="val" style="font-family:var(--mono);">${slipData.uan || "N/A"}</td>
              <td class="label">ESIC Number:</td>
              <td class="val" style="font-family:var(--mono);">${slipData.esicNo || "N/A"}</td>
            </tr>
            <tr>
              <td class="label">Total Working Days:</td>
              <td class="val"><strong>${slipData.totalDays || 30} Days</strong></td>
              <td class="label">Days Worked / Present:</td>
              <td class="val"><strong>${slipData.presentDays || 30} Days</strong></td>
            </tr>
            <tr>
              <td class="label">Overtime Hours:</td>
              <td class="val">${slipData.otHours ? slipData.otHours + " Hours" : "0 Hours"}</td>
              <td class="label">Absent / LOP:</td>
              <td class="val">${slipData.absentDays ? slipData.absentDays + " Days" : "0 Days"}</td>
            </tr>
          </table>

          <!-- Financial Breakdown: Earnings vs Deductions -->
          <table class="salary-table">
            <thead>
              <tr>
                <th style="width: 32%;">EARNINGS (कमाइयां)</th>
                <th class="amount-col">AMOUNT (₹)</th>
                <th style="width: 32%;">DEDUCTIONS (कटौतियां)</th>
                <th class="amount-col">AMOUNT (₹)</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td>Basic Salary</td>
                <td class="amount-col">${formatINR(slipData.basic)}</td>
                <td>Provident Fund (EPF)</td>
                <td class="amount-col">${formatINR(slipData.pf)}</td>
              </tr>
              <tr>
                <td>House Rent Allowance (HRA)</td>
                <td class="amount-col">${formatINR(slipData.hra)}</td>
                <td>ESIC Contribution</td>
                <td class="amount-col">${formatINR(slipData.esic)}</td>
              </tr>
              <tr>
                <td>Conveyance / Transport Allowance</td>
                <td class="amount-col">${formatINR(slipData.conveyance)}</td>
                <td>Professional Tax (PT)</td>
                <td class="amount-col">${formatINR(slipData.pt)}</td>
              </tr>
              <tr>
                <td>Overtime (OT) Pay</td>
                <td class="amount-col">${formatINR(slipData.otAmount)}</td>
                <td>Salary Advance / Loan Recovery</td>
                <td class="amount-col">${formatINR(slipData.advance)}</td>
              </tr>
              <tr>
                <td>Special / Other Allowance</td>
                <td class="amount-col">${formatINR(slipData.specialAllowance)}</td>
                <td>TDS / Income Tax</td>
                <td class="amount-col">${formatINR(slipData.tds)}</td>
              </tr>
              <tr>
                <td>Attendance / Performance Bonus</td>
                <td class="amount-col">${formatINR(slipData.bonus)}</td>
                <td>Other Deductions / Penalties</td>
                <td class="amount-col">${formatINR(slipData.otherDeductions)}</td>
              </tr>
              <tr class="total-row">
                <td><strong>GROSS EARNINGS</strong></td>
                <td class="amount-col" style="color:#1e3a8a;"><strong>₹ ${formatINR(grossEarnings)}</strong></td>
                <td><strong>TOTAL DEDUCTIONS</strong></td>
                <td class="amount-col" style="color:#ef4444;"><strong>₹ ${formatINR(totalDeductions)}</strong></td>
              </tr>
            </tbody>
          </table>

          <!-- Net Pay Box -->
          <div class="net-pay-box">
            <div class="net-pay-left">
              <div>Amount in Words (शब्दों में राशि):</div>
              <div class="net-pay-words">${slipData.netWords || ""}</div>
            </div>
            <div class="net-pay-right">
              <div class="net-pay-title">Net Take-Home Salary (शुद्ध वेतन)</div>
              <div class="net-pay-amount">₹ ${formatINR(netPay)}</div>
            </div>
          </div>
        </div>

        <div>
          <!-- Signatures & Authorization -->
          <div class="sign-section">
            <div class="sign-box">
              <div class="sign-line"></div>
              <div class="sign-title">Employee Signature</div>
              <div class="sign-subtitle">Received & Accepted</div>
            </div>
            <div class="sign-box">
              <div class="sign-line"></div>
              <div class="sign-title">For ${compName}</div>
              <div class="sign-subtitle">Authorized Signatory & Stamp</div>
            </div>
          </div>

          <div class="footer-note">
            This is a computer generated Payslip issued by ${compName}.
          </div>
        </div>
      `;

      document.getElementById("payslipRoot").innerHTML = html;
    }

    window.addEventListener("DOMContentLoaded", renderPayslip);
  </script>
</body>
</html>
