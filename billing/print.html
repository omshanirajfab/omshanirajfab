<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Tax Invoice - Print Preview</title>
  <link rel="stylesheet" href="css/print.css?v=20260921_v4" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: #e2e8f0;
      font-family: Arial, "Helvetica Neue", Helvetica, sans-serif;
      margin: 0;
      padding: 0;
    }
    .print-toolbar {
      position: sticky;
      top: 0;
      z-index: 9999;
      background: #0f172a;
      color: white;
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 14px rgba(0,0,0,0.35);
    }
    .print-toolbar-title {
      font-size: 16px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .print-btn-group {
      display: flex;
      gap: 12px;
    }
    .btn-action-print {
      background: #10b981;
      color: white;
      border: none;
      padding: 10px 24px;
      border-radius: 6px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 2px 6px rgba(16, 185, 129, 0.4);
    }
    .btn-action-print:hover {
      background: #059669;
    }
    .btn-action-close {
      background: #475569;
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    .invoice-sheet-container {
      display: flex;
      justify-content: center;
      padding: 20px 0;
      width: 100%;
    }
    .invoice-sheet {
      width: 210mm;
      max-width: 210mm;
      min-height: 282mm;
      background: #ffffff;
      padding: 4mm 6mm;
      box-shadow: 0 4px 20px rgba(0,0,0,0.2);
      box-sizing: border-box;
      font-size: 10px;
      line-height: 1.25;
    }
    .inv-tally-filler-row td {
      height: 32mm !important;
    }

    @media print {
      @page {
        size: A4 portrait;
        margin: 4mm 5mm;
      }
      html, body {
        width: 100% !important;
        height: auto !important;
        margin: 0 !important;
        padding: 0 !important;
        background: #ffffff !important;
        color: #000000 !important;
        overflow: visible !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }
      .print-toolbar, .no-print {
        display: none !important;
        height: 0 !important;
        visibility: hidden !important;
      }
      .invoice-sheet-container {
        padding: 0 !important;
        margin: 0 !important;
        width: 100% !important;
        display: block !important;
      }
      .invoice-sheet {
        width: 100% !important;
        max-width: 100% !important;
        height: auto !important;
        min-height: auto !important;
        margin: 0 !important;
        padding: 0 !important;
        box-shadow: none !important;
        border: none !important;
        page-break-inside: avoid !important;
        break-inside: avoid !important;
        page-break-after: avoid !important;
        break-after: avoid !important;
      }
      .inv-outer-table {
        width: 100% !important;
        border: 1.5px solid #000000 !important;
        page-break-inside: avoid !important;
        break-inside: avoid !important;
      }
      tr, td, th, tbody, table {
        page-break-inside: avoid !important;
        break-inside: avoid !important;
      }
    }
  </style>
</head>
<body>
  <div class="print-toolbar no-print">
    <div class="print-toolbar-title">
      <span>📄</span>
      <span id="toolbarInvoiceTitle">OSF Tax Invoice Preview</span>
    </div>
    <div class="print-btn-group">
      <button type="button" class="btn-action-print" onclick="window.print()">
        🖨️ Save as PDF / Print Invoice
      </button>
      <button type="button" class="btn-action-close" onclick="window.close()">
        ✕ Close Window
      </button>
    </div>
  </div>

  <div class="invoice-sheet-container">
    <div class="invoice-sheet" id="invoiceSheetRoot">
      <!-- Generated Tax Invoice Injected Here -->
    </div>
  </div>

  <script src="js/data.js?v=20260921_v3"></script>
  <script src="js/app.js?v=20260921_v3"></script>
  <script>
    function renderInvoiceNow() {
      try {
        OSFApp.loadState();
        
        var urlParams = new URLSearchParams(window.location.search);
        var invId = urlParams.get('id');

        var inv = null;
        var draft = localStorage.getItem(OSFApp.STORAGE_KEYS.ACTIVE_INV);
        if (draft) {
          try { inv = JSON.parse(draft); } catch(e) {}
        }

        if (!inv && invId && OSFApp.state.invoices) {
          inv = OSFApp.state.invoices.find(function(i) { return i.id === invId; });
        }

        if (!inv && OSFApp.state.invoices && OSFApp.state.invoices.length > 0) {
          inv = OSFApp.state.invoices[0];
        }

        if (!inv) {
          OSFApp.createNewInvoice();
          inv = OSFApp.state.currentInvoice;
        }

        if (inv) {
          document.title = "Tax Invoice - " + (inv.invoiceNo || "OSF");
          var titleEl = document.getElementById('toolbarInvoiceTitle');
          if (titleEl) titleEl.innerText = "Tax Invoice: " + (inv.invoiceNo || "OSF");

          var html = OSFApp.generateInvoiceHTML(inv);
          var root = document.getElementById('invoiceSheetRoot');
          if (root) root.innerHTML = html;
        }
      } catch(err) {
        console.error("Print render error:", err);
      }
    }

    renderInvoiceNow();
  </script>
</body>
</html>
